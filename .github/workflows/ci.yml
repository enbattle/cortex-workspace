name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: shellcheck --severity=warning bin/*.sh template/cortex/bin/*.sh tests/*.sh evals/golden/*/refresh.sh
      - name: test suites
        run: bash tests/run.sh --parallel

  # The scripts must run on macOS's /bin/bash 3.2 and on Git Bash (3.0.0
  # spec D15): install, upgrade and remove, on both, with every bash call
  # resolved to that bash.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: bash is /bin/bash 3.2
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: git on this runner (diagnostic)
        run: |
          git version
          git config --list --show-origin
          d="$(mktemp -d)"; git -C "$d" init -q; echo a > "$d/a"; git -C "$d" add a
          git -C "$d" -c user.name=t -c user.email=t@t commit -qm a; git -C "$d" ls-files -v
          git -C "$d" status --porcelain; git -C "$d" ls-files -v
      - name: install, upgrade and remove suites
        run: |
          bash --version | head -n 1 | grep -q 'version 3\.2' || { bash --version; exit 1; }
          bash tests/run.sh install upgrade remove

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: install, upgrade and remove suites (Git Bash)
        run: bash tests/run.sh install upgrade remove
