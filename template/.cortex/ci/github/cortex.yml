# cortex gates on every pull request: the server-side boundary for the test
# lock (see scripts/cortex/ci-gates.sh). Copy to .github/workflows/cortex.yml,
# then make the "cortex" check required on the default branch and require
# review from Code Owners (on `pull_request` the branch also supplies this
# workflow file; required Code Owners review of /.github/ is what protects it).
#
# Actions are pinned to full commit SHAs (a tag can be moved to new code; a
# SHA can't); let Dependabot's github-actions updates keep them current.
name: cortex

on:
  pull_request:

permissions:
  contents: read

jobs:
  cortex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The branch as pushed, not GitHub's merge preview: the test lock
          # compares the branch with its own lock commit, so a later change on
          # the base branch must not read as tampering.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the lock check needs the branch's full history
      # Add the setup your BUILD_CMD / TEST_CMD / LINT_CMD need here, e.g.
      # actions/setup-node plus `npm ci`, pinned to a SHA like the step above.
      - name: Gates, with every checker taken from the base branch
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # ci-gates.sh itself comes from the base too, so the change under
          # review can't edit the script that judges it. The branch's copy is
          # used only when the base has none (the change that installs cortex).
          if git cat-file -e "$BASE:scripts/cortex/ci-gates.sh" 2>/dev/null; then
            git show "$BASE:scripts/cortex/ci-gates.sh" > "$RUNNER_TEMP/ci-gates.sh"
          else
            cp scripts/cortex/ci-gates.sh "$RUNNER_TEMP/ci-gates.sh"
          fi
          bash "$RUNNER_TEMP/ci-gates.sh" "$BASE"
